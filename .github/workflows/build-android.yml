name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager "ndk;27.0.12077973"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build nasm curl zip unzip tar pkg-config

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git /opt/vcpkg
          /opt/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=/opt/vcpkg" >> $GITHUB_ENV

      - name: Install vcpkg packages for Android
        run: |
          /opt/vcpkg/vcpkg install opus libvpx libyuv aom --triplet arm64-android --host-triplet x64-linux --classic

      - name: Build Rust for Android
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
          VCPKG_ROOT: /opt/vcpkg
        run: |
          cargo ndk -t arm64-v8a -o flutter/android/app/src/main/jniLibs build --release

      - name: Build APK
        run: |
          cd flutter
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SharpPOS-Remote-Android
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
